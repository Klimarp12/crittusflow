<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crittus Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Scripts do Firebase adicionados aqui -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    :root { --primary: #3b82f6; --bg: #f3f4f6; --text: #1f2937; --card: #ffffff; --border: #e5e7eb; }
    .dark { --primary: #60a5fa; --bg: #111827; --text: #f9fafb; --card: #1f2937; --border: #374151; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: all 0.3s ease; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-outline { border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--border); }
    input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 0.5rem; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); ring: 2px solid var(--primary); }
    .nav-item { padding: 0.75rem 1rem; border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; color: #6b7280; }
    .nav-item:hover, .nav-item.active { background: var(--primary); color: white; }
    .dark .nav-item:hover, .dark .nav-item.active { background: #374151; color: var(--primary); }
    .kanban-col { min-width: 280px; max-width: 280px; }
    .deal-card { cursor: grab; }
    .deal-card:active { cursor: grabbing; }
    #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 50; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { padding: 1rem; border-radius: 0.5rem; color: white; animation: slideIn 0.3s ease forwards; opacity: 0; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .glass { background: rgba(var(--card-rgb), 0.8); backdrop-filter: blur(10px); }
    .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .status-Ativo { background: #dcfce7; color: #166534; }
    .status-Inativo { background: #fee2e2; color: #991b1b; }
    .dark .status-Ativo { background: #064e3b; color: #34d399; }
    .dark .status-Inativo { background: #7f1d1d; color: #f87171; }
    .heat-Frio { color: #3b82f6; } .heat-Morno { color: #f59e0b; } .heat-Quente { color: #ef4444; }
    /* Estilos Login */
    #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .login-box { background: var(--card); padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-sm">

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-box border border-gray-200 dark:border-gray-700">
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-3xl">
          <i class="fas fa-water"></i>
        </div>
      </div>
      <h1 class="text-2xl font-bold mb-2">Crittus Flow</h1>
      <p class="text-gray-500 mb-6">Gestão Inteligente</p>
      <form id="login-form" class="space-y-4">
        <div>
          <input type="text" id="login-user" placeholder="Usuário" required class="w-full">
        </div>
        <div>
          <input type="password" id="login-pass" placeholder="Senha" required class="w-full">
        </div>
        <button type="submit" class="btn btn-primary w-full py-2 text-lg mt-4">Entrar</button>
      </form>
      <div id="login-error" class="text-red-500 mt-4 hidden text-sm">Credenciais inválidas!</div>
    </div>
  </div>

  <!-- App Main (Hidden by default) -->
  <div id="app" class="flex w-full h-full hidden">
    <!-- Sidebar -->
    <aside class="w-64 card m-4 flex flex-col hidden md:flex transition-all">
      <div class="p-6 flex items-center gap-3 border-b border-[var(--border)]">
        <i class="fas fa-water text-2xl text-[var(--primary)]"></i>
        <h1 class="text-xl font-bold tracking-tight">Crittus Flow</h1>
      </div>
      <nav class="p-4 flex-1 space-y-2 overflow-y-auto" id="nav-menu">
        <div class="nav-item active" data-view="dashboard"><i class="fas fa-chart-pie w-6"></i> Dashboard</div>
        <div class="nav-item" data-view="clients"><i class="fas fa-users w-6"></i> Clientes</div>
        <div class="nav-item" data-view="crm"><i class="fas fa-handshake w-6"></i> CRM / Funil</div>
        <div class="nav-item" data-view="projects"><i class="fas fa-project-diagram w-6"></i> Projetos</div>
        <div class="nav-item" data-view="finance"><i class="fas fa-wallet w-6"></i> Financeiro</div>
        <div class="nav-item" data-view="reports"><i class="fas fa-file-alt w-6"></i> Relatórios</div>
        <div class="nav-item" data-view="settings"><i class="fas fa-cog w-6"></i> Configurações</div>
      </nav>
      <div class="p-4 border-t border-[var(--border)] space-y-2">
        <button class="btn btn-outline w-full text-left flex items-center gap-2" onclick="toggleTheme()"><i class="fas fa-moon w-5"></i> Tema</button>
        <button class="btn btn-outline w-full text-left flex items-center gap-2 text-red-500" onclick="logout()"><i class="fas fa-sign-out-alt w-5"></i> Sair</button>
      </div>
    </aside>

    <!-- Mobile Header -->
    <div class="md:hidden fixed top-0 w-full card z-20 flex justify-between items-center p-4 border-b-0">
      <div class="flex items-center gap-2"><i class="fas fa-water text-[var(--primary)]"></i> <span class="font-bold">Crittus Flow</span></div>
      <button onclick="$('aside').classList.toggle('hidden');$('aside').classList.toggle('absolute');$('aside').classList.toggle('z-30');$('aside').classList.toggle('h-[calc(100vh-2rem)]')" class="text-2xl"><i class="fas fa-bars"></i></button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col m-4 mt-16 md:mt-4 ml-4 md:ml-0 overflow-hidden relative">
      <header class="card p-4 mb-4 flex justify-between items-center shrink-0">
        <h2 id="view-title" class="text-xl font-semibold">Dashboard</h2>
        <div id="header-actions" class="flex gap-2"></div>
      </header>
      <div id="content-area" class="flex-1 overflow-y-auto space-y-4 pb-12"></div>
    </main>
  </div>

  <div id="toast-container"></div>
  <div id="modal-container" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="card w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="p-4 border-b border-[var(--border)] flex justify-between items-center">
        <h3 id="modal-title" class="text-lg font-bold"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
      </div>
      <div id="modal-body" class="p-4 overflow-y-auto flex-1"></div>
      <div class="p-4 border-t border-[var(--border)] flex justify-end gap-2" id="modal-footer"></div>
    </div>
  </div>

<script>
// --- CONFIGURAÇÃO DO FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyCEUNMNFEPeSZS9_yETvZc2X3Yb9OiLUq4",
  authDomain: "crittus-flow.firebaseapp.com",
  databaseURL: "https://crittus-flow-default-rtdb.firebaseio.com",
  projectId: "crittus-flow",
  storageBucket: "crittus-flow.firebasestorage.app",
  messagingSenderId: "446646380066",
  appId: "1:446646380066:web:9934c96216f8c53559cc7b"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
// --------------------------------

const KEY='crittus_flow_v8';
const STATUSES=['Não contatado','Paquera','Proposta','Fechado/Projeto','Perdido'];
const HEAT=['Frio','Morno','Quente'];
const ACTIONS=['Telefone','E-mail','WhatsApp','Visita','Outro'];
const NETWORKS=['Instagram','Facebook','Site/Blog','Google Meu Negócio','TikTok','Pinterest','YouTube','Outros'];

let db={clients:[],deals:[],projects:[],payables:[],receivables:[]};
let currentView='dashboard',filters={};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

// --- ESCUTAR A BASE DE DADOS EM TEMPO REAL ---
database.ref(KEY).on('value', (snapshot) => {
  const data = snapshot.val();
  if (data) {
    db = migrate(data);
  } else {
    // Se a base de dados estiver vazia, inicializa uma nova
    db = migrate({clients:[],deals:[],projects:[],payables:[],receivables:[]});
  }
  // Só atualiza o ecrã se o utilizador já tiver feito o login
  if (!$('#app').classList.contains('hidden')) {
    setView(currentView);
  }
});
// ---------------------------------------------

function migrate(d){
  d=Object.assign({clients:[],deals:[],projects:[],payables:[],receivables:[]},d||{});
  d.clients.forEach(c=>{c.status=c.status||'Ativo';c.networks=c.networks||[]});
  d.deals.forEach(x=>{x.history=x.history||[];x.lossReason=x.lossReason||''});
  d.projects.forEach(p=>{p.schedule=(p.schedule||[]).map(a=>Object.assign({id:uid(),status:'Pendente'},a));p.receivableId=p.receivableId||null;delete p.installments});
  d.receivables.forEach(r=>{r.installments=(r.installments||[]).map(i=>Object.assign({id:uid(),payments:i.payments||[]},i))});
  d.payables.forEach(p=>{p.payments=p.payments||[];p.recurring=!!p.recurring});
  refreshOverdue(d);
  return d;
}

// --- GUARDAR NA NUVEM ---
function save(){
  try {
    database.ref(KEY).set(db);
  } catch(e) {
    toast('Erro ao guardar na nuvem.', 'error');
  }
}
// ------------------------

function refreshOverdue(d){
  const today=new Date().toISOString().split('T')[0];
  d.receivables.forEach(r=>{
    let allPaid=true;
    r.installments.forEach(i=>{
      const paid=i.payments.reduce((sum,p)=>sum+p.amount,0);
      if(paid<i.amount){allPaid=false;if(i.date<today)i.status='Atrasado';else if(i.status==='Atrasado')i.status='Pendente'}
      else i.status='Pago';
    });
    r.status=allPaid?'Pago':r.installments.some(i=>i.status==='Atrasado')?'Atrasado':'Pendente';
  });
  d.payables.forEach(p=>{
    const paid=p.payments.reduce((sum,py)=>sum+py.amount,0);
    if(paid<p.amount){if(p.dueDate<today)p.status='Atrasado';else if(p.status==='Atrasado')p.status='Pendente'}
    else p.status='Pago';
  });
}

function toast(msg,type='success'){
  const t=document.createElement('div');
  t.className=`toast ${type==='success'?'bg-green-500':'bg-red-500'}`;
  t.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'} mr-2"></i>${msg}`;
  $('#toast-container').appendChild(t);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},3000);
}

function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');
}
if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark');

function fmtMoney(n){return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function fmtDate(d){return d?d.split('-').reverse().join('/'):'-'}

// Login Logic
$('#login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = $('#login-user').value;
  const p = $('#login-pass').value;
  if(u === 'admin' && p === '24121103') {
    $('#login-screen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    setView('dashboard');
  } else {
    $('#login-error').classList.remove('hidden');
  }
});

function logout() {
  $('#login-user').value = '';
  $('#login-pass').value = '';
  $('#login-error').classList.add('hidden');
  $('#app').classList.add('hidden');
  $('#login-screen').classList.remove('hidden');
}

$$('.nav-item').forEach(el=>el.addEventListener('click',(e)=>{$$
('.nav-item').forEach(n=>n.classList.remove('active'));
  e.currentTarget.classList.add('active');
  if(window.innerWidth<768)$('aside').classList.add('hidden');
  setView(e.currentTarget.dataset.view);
}));

function setView(view){
  currentView=view;
  const c=$('#content-area');
  const h=$('#header-actions');
  c.innerHTML=''; h.innerHTML=''; filters={};
  
  if(view==='dashboard') renderDashboard(c,h);
  if(view==='clients') renderClients(c,h);
  if(view==='crm') renderCRM(c,h);
  if(view==='projects') renderProjects(c,h);
  if(view==='finance') renderFinance(c,h);
  if(view==='reports') renderReports(c,h);
  if(view==='settings') renderSettings(c,h);
  
  $('#view-title').innerText=view.charAt(0).toUpperCase()+view.slice(1).replace('Finance','Financeiro').replace('Reports','Relatórios').replace('Settings','Configurações');
}

/* ================= MODAL ================= */
function openModal(title,bodyHtml,footerHtml){
  $('#modal-title').innerText=title;
  $('#modal-body').innerHTML=bodyHtml;
  $('#modal-footer').innerHTML=footerHtml;
  $('#modal-container').classList.remove('hidden');
}
function closeModal(){$('#modal-container').classList.add('hidden')}

/* ================= DASHBOARD ================= */
function renderDashboard(c,h){
  const thisMonth=new Date().toISOString().slice(0,7);
  const rev=db.receivables.flatMap(r=>r.installments).filter(i=>i.date.startsWith(thisMonth)&&i.status==='Pago').reduce((s,i)=>s+(i.payments.reduce((ps,p)=>ps+p.amount,0)),0);
  const exp=db.payables.filter(p=>p.dueDate.startsWith(thisMonth)&&p.status==='Pago').reduce((s,p)=>s+(p.payments.reduce((ps,py)=>ps+py.amount,0)),0);
  const activeClients=db.clients.filter(c=>c.status==='Ativo').length;
  const openDeals=db.deals.filter(d=>d.status!=='Fechado/Projeto'&&d.status!=='Perdido').length;

  c.innerHTML=`
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card p-4 border-l-4 border-blue-500"><p class="text-gray-500 text-xs">Receitas (Mês)</p><h3 class="text-xl font-bold text-blue-600">${fmtMoney(rev)}</h3></div>
      <div class="card p-4 border-l-4 border-red-500"><p class="text-gray-500 text-xs">Despesas (Mês)</p><h3 class="text-xl font-bold text-red-600">${fmtMoney(exp)}</h3></div>
      <div class="card p-4 border-l-4 border-green-500"><p class="text-gray-500 text-xs">Lucro (Mês)</p><h3 class="text-xl font-bold text-green-600">${fmtMoney(rev-exp)}</h3></div>
      <div class="card p-4 border-l-4 border-purple-500"><p class="text-gray-500 text-xs">Clientes / Negócios</p><h3 class="text-xl font-bold">${activeClients} / ${openDeals}</h3></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
      <div class="card p-4"><h3 class="font-bold mb-4">Fluxo de Caixa (6 Meses)</h3><canvas id="chartCash"></canvas></div>
      <div class="card p-4"><h3 class="font-bold mb-4">Funil de Vendas</h3><canvas id="chartFunnel"></canvas></div>
    </div>
  `;

  setTimeout(()=>{
    const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-i);return d.toISOString().slice(0,7)}).reverse();
    const revData=months.map(m=>db.receivables.flatMap(r=>r.installments).filter(i=>i.date.startsWith(m)&&i.status==='Pago').reduce((s,i)=>s+(i.payments.reduce((ps,p)=>ps+p.amount,0)),0));
    const expData=months.map(m=>db.payables.filter(p=>p.dueDate.startsWith(m)&&p.status==='Pago').reduce((s,p)=>s+(p.payments.reduce((ps,py)=>ps+py.amount,0)),0));
    new Chart($('#chartCash'),{type:'bar',data:{labels:months.map(m=>m.split('-').reverse().join('/')),datasets:[{label:'Receitas',data:revData,backgroundColor:'#3b82f6'},{label:'Despesas',data:expData,backgroundColor:'#ef4444'}]}});
    
    const funnelData=STATUSES.map(s=>db.deals.filter(d=>d.status===s).length);
    new Chart($('#chartFunnel'),{type:'doughnut',data:{labels:STATUSES,datasets:[{data:funnelData,backgroundColor:['#9ca3af','#f59e0b','#3b82f6','#10b981','#ef4444']}]}});
  },100);
}

/* ================= CLIENTES ================= */
function renderClients(c,h){
  h.innerHTML=`<input type="text" id="search-client" placeholder="Buscar..." class="w-48"><button class="btn btn-primary" onclick="editClient()">+ Novo</button>`;
  const updateList=()=>{
    const q=($('#search-client')?.value||'').toLowerCase();
    const list=db.clients.filter(cl=>cl.name.toLowerCase().includes(q)||cl.doc.includes(q));
    c.innerHTML=`<div class="card overflow-x-auto"><table class="w-full text-left border-collapse">
      <thead class="bg-[var(--bg)] border-b border-[var(--border)]"><tr><th class="p-3">Nome</th><th class="p-3">Doc/CPF</th><th class="p-3">Status</th><th class="p-3">Ações</th></tr></thead>
      <tbody>${list.map(cl=>`
        <tr class="border-b border-[var(--border)] hover:bg-[var(--bg)]">
          <td class="p-3"><div class="font-bold">${cl.name}</div><div class="text-xs text-gray-500">${cl.email||''}</div></td>
          <td class="p-3">${cl.doc||'-'}</td>
          <td class="p-3"><span class="status-badge status-${cl.status}">${cl.status}</span></td>
          <td class="p-3 space-x-2">
            <button class="text-blue-500 hover:text-blue-700" onclick="editClient('${cl.id}')"><i class="fas fa-edit"></i></button>
            <button class="text-red-500 hover:text-red-700" onclick="delClient('${cl.id}')"><i class="fas fa-trash"></i></button>
            <a href="https://wa.me/${(cl.phone||'').replace(/\D/g,'')}" target="_blank" class="text-green-500 hover:text-green-700"><i class="fab fa-whatsapp"></i></a>
          </td>
        </tr>`).join('')||'<tr><td colspan="4" class="p-4 text-center">Nenhum cliente</td></tr>'}
      </tbody></table></div>`;
  };
  updateList();
  $('#search-client').addEventListener('input',updateList);
}

window.editClient=id=>{
  const cl=db.clients.find(x=>x.id===id)||{id:uid(),name:'',doc:'',email:'',phone:'',address:'',notes:'',status:'Ativo',networks:[],niche:'',products:''};
  openModal(id?'Editar Cliente':'Novo Cliente',`
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="text-xs">Nome/Razão Social*</label><input type="text" id="cl-name" value="${cl.name}"></div>
      <div><label class="text-xs">CPF/CNPJ</label><input type="text" id="cl-doc" value="${cl.doc}"></div>
      <div><label class="text-xs">E-mail</label><input type="email" id="cl-email" value="${cl.email}"></div>
      <div><label class="text-xs">Telefone</label><input type="text" id="cl-phone" value="${cl.phone}"></div>
      <div><label class="text-xs">Status</label><select id="cl-status"><option ${cl.status==='Ativo'?'selected':''}>Ativo</option><option ${cl.status==='Inativo'?'selected':''}>Inativo</option></select></div>
      <div><label class="text-xs">Nicho de Atuação</label><input type="text" id="cl-niche" value="${cl.niche||''}"></div>
      <div class="col-span-full"><label class="text-xs">Produtos/Serviços que vende</label><input type="text" id="cl-products" value="${cl.products||''}"></div>
      <div class="col-span-full"><label class="text-xs">Redes Sociais Existentes</label>
        <div class="flex flex-wrap gap-2 mt-1">
          ${NETWORKS.map(n=>`<label class="flex items-center gap-1 text-xs"><input type="checkbox" class="cl-net" value="${n}" ${cl.networks.includes(n)?'checked':''}>${n}</label>`).join('')}
        </div>
      </div>
      <div class="col-span-full"><label class="text-xs">Endereço</label><input type="text" id="cl-address" value="${cl.address}"></div>
      <div class="col-span-full"><label class="text-xs">Notas</label><textarea id="cl-notes" rows="3">${cl.notes}</textarea></div>
    </div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveClient('${cl.id}')">Salvar</button>`);
};
window.saveClient=id=>{
  const name=$('#cl-name').value.trim(); if(!name) return toast('Nome obrigatório','error');
  const cl={id,name,doc:$('#cl-doc').value,email:$('#cl-email').value,phone:$('#cl-phone').value,address:$('#cl-address').value,notes:$('#cl-notes').value,status:$('#cl-status').value,niche:$('#cl-niche').value,products:$('#cl-products').value,networks:$$('.cl-net:checked').map(e=>e.value)};
  const idx=db.clients.findIndex(x=>x.id===id);
  if(idx>-1) db.clients[idx]=cl; else db.clients.push(cl);
  save(); closeModal(); setView('clients'); toast('Cliente salvo!');
};
window.delClient=id=>{if(confirm('Excluir cliente? Negócios/Projetos atrelados podem perder a referência.')){db.clients=db.clients.filter(x=>x.id!==id);save();setView('clients');toast('Excluído');}};

/* ================= CRM / FUNIL ================= */
function renderCRM(c,h){
  h.innerHTML=`<button class="btn btn-primary" onclick="editDeal()">+ Novo Negócio</button>`;
  c.innerHTML=`<div class="flex gap-4 overflow-x-auto pb-4 h-full" id="kanban-board"></div>`;

window.generateReceivable=pid=>{
  const p=db.projects.find(x=>x.id===pid);
  const q=parseInt(prompt(`Gerar parcelas para "${p.title}" (R$ ${p.value.toFixed(2)}). Quantas parcelas?`,'1'));
  if(isNaN(q)||q<1) return;
  let d=new Date();
  const insts=[]; const val=p.value/q;
  for(let i=0;i<q;i++){
    insts.push({id:uid(),date:d.toISOString().split('T')[0],amount:val,status:'Pendente',payments:[]});
    d.setMonth(d.getMonth()+1);
  }
  const r={id:uid(),clientId:p.clientId,desc:`Projeto: ${p.title}`,total:p.value,installments:insts,status:'Pendente'};
  db.receivables.push(r); p.receivableId=r.id; save(); toast(`Gerado em ${q}x no Financeiro!`); viewProject(pid);
};

window.receiveInst=(rid,iid)=>{
  const amt=parseFloat($(`#pay-amt-${iid}`).value), dt=$(`#pay-dt-${iid}`).value;
  if(isNaN(amt)||amt<=0||!dt) return;
  const r=db.receivables.find(x=>x.id===rid); const i=r.installments.find(x=>x.id===iid);
  i.payments.push({id:uid(),date:dt,amount:amt}); save(); viewRec(rid); refreshOverdue(db); if($('#app').classList.contains('hidden')===false&&currentView==='finance') setView('finance');
};

function renderPayables(c){
  const list=db.payables;
  c.innerHTML=`<div class="card overflow-x-auto"><table class="w-full text-left border-collapse">
    <thead class="bg-[var(--bg)] border-b border-[var(--border)]"><tr><th class="p-3">Descrição / Categoria</th><th class="p-3">Valor</th><th class="p-3">Vencimento</th><th class="p-3">Status</th><th class="p-3">Ações</th></tr></thead>
    <tbody>${list.map(p=>{
      const paid=p.payments.reduce((s,py)=>s+py.amount,0);
      return `
      <tr class="border-b border-[var(--border)] hover:bg-[var(--bg)]">
        <td class="p-3"><div class="font-bold">${p.desc}</div><div class="text-xs text-gray-500">${p.category\vert{}\vert{}'-'}${p.recurring?'(Fixo)':''}</div></td>
        <td class="p-3 font-semibold">${fmtMoney(p.amount)} <div class="text-[10px] text-gray-500">${fmtMoney(paid)} pago</div></td>
        <td class="p-3">${fmtDate(p.dueDate)}</td>
        <td class="p-3"><span class="text-xs font-bold ${p.status==='Pago'?'text-green-500':p.status==='Atrasado'?'text-red-500':'text-yellow-500'}">${p.status}</span></td>
        <td class="p-3 space-x-2">
          ${p.status!=='Pago'?`<button class="btn btn-outline py-1 text-xs" onclick="payModal('${p.id}')">Pagar</button>`:''}
          <button class="text-red-500 hover:text-red-700" onclick="delPay('${p.id}')"><i class="fas fa-trash"></i></button>
        </td>
      </tr>`;
    }).join('')||'<tr><td colspan="5" class="p-4 text-center">Nada a pagar.</td></tr>'}</tbody></table></div>`;
}
window.editPay=()=>{
  openModal('Nova Despesa',`
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full"><label class="text-xs">Descrição*</label><input type="text" id="p-desc"></div>
      <div><label class="text-xs">Categoria</label><input type="text" id="p-cat" placeholder="Ex: Impostos, Software..."></div>
      <div><label class="text-xs">Valor (R$)*</label><input type="number" id="p-amt" step="0.01"></div>
      <div><label class="text-xs">Vencimento*</label><input type="date" id="p-date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="flex items-center mt-6"><label class="flex items-center gap-2 cursor-pointer text-sm"><input type="checkbox" id="p-rec"> Despesa Fixa / Recorrente</label></div>
    </div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createPay()">Salvar</button>`);
};
window.createPay=()=>{
  const desc=$('#p-desc').value.trim(), amt=parseFloat($('#p-amt').value), dt=$('#p-date').value;
  if(!desc||isNaN(amt)||amt<=0||!dt) return toast('Preencha os campos obrigatórios.','error');
  db.payables.push({id:uid(),desc,category:$('#p-cat').value,amount:amt,dueDate:dt,recurring:$('#p-rec').checked,status:'Pendente',payments:[]});
  save(); closeModal(); setView('finance'); toast('Despesa salva!');
};
window.delPay=id=>{if(confirm('Excluir despesa?')){db.payables=db.payables.filter(x=>x.id!==id);save();setView('finance');toast('Excluída');}};
window.payModal=id=>{
  const p=db.payables.find(x=>x.id===id); const paid=p.payments.reduce((s,py)=>s+py.amount,0); const pend=p.amount-paid;
  openModal(`Baixar Despesa: ${p.desc}`,`
    <div class="space-y-4">
      <div class="flex justify-between"><span>Valor Pendente:</span><span class="font-bold text-red-500">${fmtMoney(pend)}</span></div>
      <div><label class="text-xs">Valor a Pagar</label><input type="number" id="pay-amt" value="${pend.toFixed(2)}" step="0.01"></div>
      <div><label class="text-xs">Data do Pagamento</label><input type="date" id="pay-dt" value="${new Date().toISOString().split('T')[0]}"></div>
    </div>
  `,`<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="execPay('${p.id}')">Confirmar Pagamento</button>`);
};
window.execPay=id=>{
  const amt=parseFloat($('#pay-amt').value), dt=$('#pay-dt').value; if(isNaN(amt)||amt<=0||!dt) return;
  const p=db.payables.find(x=>x.id===id);
  p.payments.push({id:uid(),date:dt,amount:amt});
  // Se for recorrente e pagou total, recria pro proximo mes
  const paid=p.payments.reduce((s,py)=>s+py.amount,0);
  if(paid>=p.amount && p.recurring){
    let d=new Date(p.dueDate+'T00:00:00'); d.setMonth(d.getMonth()+1);
    db.payables.push({id:uid(),desc:p.desc,category:p.category,amount:p.amount,dueDate:d.toISOString().split('T')[0],recurring:true,status:'Pendente',payments:[]});
    p.recurring=false; // A original deixa de ser a matriz
  }
  save(); closeModal(); refreshOverdue(db); setView('finance'); toast('Pagamento registrado!');
};

/* ================= RELATÓRIOS ================= */
function renderReports(c,h){
  const m=new Date().toISOString().slice(0,7);
  const mStr=`${m.split('-')[1]}/${m.split('-')[0]}`;
  c.innerHTML=`
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div class="card p-4">
        <h3 class="font-bold mb-4">Resumo do Mês (${mStr})</h3>
        <button class="btn btn-outline w-full mb-2 flex justify-between" onclick="genReportPDF('financeiro')"><span>Fluxo de Caixa</span><i class="fas fa-file-pdf text-red-500"></i></button>
        <button class="btn btn-outline w-full mb-2 flex justify-between" onclick="genReportPDF('vendas')"><span>Vendas / Funil</span><i class="fas fa-file-pdf text-red-500"></i></button>
      </div>
    </div>
  `;
}
window.genReportPDF=type=>{
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); const m=new Date().toISOString().slice(0,7);
  doc.setFontSize(18); doc.text(`Relatório de ${type==='financeiro'?'Financeiro':'Vendas'}`,14,22); doc.setFontSize(10); doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')} - Crittus Flow`,14,30);
  let y=40;
  if(type==='financeiro'){
    const rev=db.receivables.flatMap(r=>r.installments).filter(i=>i.date.startsWith(m)&&i.status==='Pago').reduce((s,i)=>s+(i.payments.reduce((ps,p)=>ps+p.amount,0)),0);
    const exp=db.payables.filter(p=>p.dueDate.startsWith(m)&&p.status==='Pago').reduce((s,p)=>s+(p.payments.reduce((ps,py)=>ps+py.amount,0)),0);
    doc.text(`Receitas (Pagamento no mês): ${fmtMoney(rev)}`,14,y); y+=10;
    doc.text(`Despesas (Pagas no mês): ${fmtMoney(exp)}`,14,y); y+=10;
    doc.text(`Saldo: ${fmtMoney(rev-exp)}`,14,y);
  }else{
    const total=db.deals.length; const won=db.deals.filter(d=>d.status==='Fechado/Projeto').length;
    doc.text(`Total de Negócios: ${total}`,14,y); y+=10;
    doc.text(`Negócios Fechados: ${won} (${total?Math.round((won/total)*100):0}%)`,14,y); y+=15;
    doc.text('Distribuição por Status:',14,y); y+=10;
    STATUSES.forEach(s=>{doc.text(`- ${s}: ${db.deals.filter(d=>d.status===s).length}`,14,y); y+=8;});
  }
  doc.save(`relatorio_${type}_${m}.pdf`); toast('PDF Gerado!');
};

/* ================= CONFIGURAÇÕES ================= */
function renderSettings(c,h){
  c.innerHTML=`
    <div class="card p-4 max-w-2xl mx-auto space-y-6">
      <div><h3 class="font-bold text-lg mb-2">Dados do Sistema (Nuvem Firebase)</h3>
      <p class="text-sm text-gray-500 mb-4">Os seus dados estão a ser guardados automaticamente na nuvem da Google (Firebase) em tempo real.</p>
      </div>
      <div class="border-t border-[var(--border)] pt-4">
        <h3 class="font-bold mb-2">Backup Manual</h3>
        <p class="text-sm text-gray-500 mb-4">Ainda pode exportar uma cópia local por segurança.</p>
        <div class="flex gap-2">
          <button class="btn btn-outline" onclick="exportData()"><i class="fas fa-download"></i> Exportar JSON</button>
          <label class="btn btn-outline cursor-pointer"><i class="fas fa-upload"></i> Importar JSON<input type="file" hidden accept=".json" onchange="importData(event)"></label>
        </div>
      </div>
      <div class="border-t border-red-200 pt-4">
        <h3 class="font-bold text-red-500 mb-2">Zona de Perigo</h3>
        <button class="btn bg-red-100 text-red-600 hover:bg-red-200" onclick="clearData()">Apagar Todos os Dados da Nuvem</button>
      </div>
    </div>
  `;
}
window.exportData=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`crittus_flow_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click(); toast('Backup exportado');
};
window.importData=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{
    try{const d=JSON.parse(ev.target.result); db=migrate(d); save(); setView('settings'); toast('Dados restaurados!');}
    catch(err){toast('Arquivo inválido','error')}
  }; r.readAsText(f);
};
window.clearData=()=>{
  if(prompt('Escreva "APAGAR" para confirmar a exclusão de TODOS os dados (Clientes, Negócios, Financeiro) da nuvem.')==='APAGAR'){
    db={clients:[],deals:[],projects:[],payables:[],receivables:[]}; save(); setView('dashboard'); toast('Base de dados limpa.','error');
  }
};

</script>
