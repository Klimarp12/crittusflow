<style>
:root{--bg:#07080f;--surface:#10141f;--surface-3:#1b2133;--line:#28304a;--text:#f4f6fb;--muted:#98a2bd;--muted-2:#79839f;--primary:#8d6bff;--primary-2:#b388ff;--success:#42d4b2;--warning:#ffbd5a;--danger:#ff657d;--radius:20px;--radius-sm:12px;--shadow:0 24px 70px rgba(0,0,0,.45)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 8% -8%,rgba(141,107,255,.16),transparent),radial-gradient(900px 650px at 100% 0,rgba(66,212,178,.10),transparent),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:var(--primary-2)}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(460px,100%);padding:44px;border-radius:30px;background:linear-gradient(155deg,rgba(21,26,41,.96),rgba(10,12,20,.96));border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow)}.logo{display:flex;align-items:center;gap:12px;font-weight:850}.logo-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--primary),#ff8ac7);font-weight:900}.auth-card h1{font-size:30px;margin:30px 0 10px}.auth-card p{color:var(--muted);margin:0 0 28px}
label{display:block;margin-bottom:7px;font-size:12px;font-weight:800;color:#c8cee3;text-transform:uppercase}input,select,textarea{width:100%;padding:12px;color:var(--text);background:#0d101a;border:1px solid var(--line);border-radius:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(141,107,255,.13)}textarea{min-height:95px;resize:vertical}select:disabled{opacity:.7;cursor:not-allowed}
.btn{padding:11px 15px;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--primary),#6b48e0)}.btn:hover{filter:brightness(1.08)}.btn.full{width:100%}.btn.secondary{background:var(--surface-3)}.btn.success{background:linear-gradient(135deg,#22b392,#128a71)}.btn.danger{background:linear-gradient(135deg,#b2364e,#8d2338)}.btn.small{padding:6px 10px;font-size:12px;border-radius:9px}.btn.ghost{background:transparent;border:1px solid var(--line)}
#app{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;padding:22px 14px;border-right:1px solid var(--line);background:rgba(7,8,15,.88);display:flex;flex-direction:column}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:10px;padding:12px;color:#a9b2ca;background:transparent;border-radius:11px;font-weight:750;text-align:left}.nav button:hover{background:#1d2436;color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(141,107,255,.2),transparent);color:#fff;box-shadow:inset 3px 0 var(--primary)}.side-section{padding:16px 12px 6px;font-size:10px;letter-spacing:.12em;color:var(--muted-2);text-transform:uppercase;font-weight:800}.side-foot{margin-top:auto;padding:14px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted)}
main{margin-left:260px;width:calc(100% - 260px);padding:32px;max-width:1700px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:6px 0 0;color:var(--muted)}.head-actions{display:flex;gap:9px;flex-wrap:wrap}.section{margin-bottom:20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-title h2{margin:0;font-size:16px}.small{color:var(--muted);font-size:12px}
.card{background:linear-gradient(150deg,rgba(24,29,45,.96),rgba(13,16,26,.96));border:1px solid rgba(255,255,255,.07);border-radius:18px;box-shadow:var(--shadow);padding:20px}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.metric-value{margin-top:11px;font-size:26px;font-weight:900}.metric-sub{margin-top:6px;font-size:12px;color:var(--muted-2)}.good{color:var(--success)}.warn{color:var(--warning)}.bad{color:var(--danger)}.primary{color:var(--primary-2)}
.table-card{padding:0;overflow:hidden}.table-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.table-scroll{overflow:auto}.table{width:100%;min-width:1000px;border-collapse:collapse}.table th{position:sticky;top:0;background:#151a29;padding:13px 17px;color:#98a2bd;font-size:10px;text-transform:uppercase;letter-spacing:.09em;text-align:left;border-bottom:1px solid var(--line)}.table td{padding:14px 17px;border-bottom:1px solid rgba(40,48,74,.6);vertical-align:middle}.table tbody tr:hover{background:rgba(141,107,255,.05)}.empty{padding:40px;text-align:center;color:var(--muted)}.primary-cell{font-weight:800}.secondary-cell{color:var(--muted);font-size:12px;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#272f45;color:#cbd2e8}.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#8792ad}.badge.green{background:rgba(66,212,178,.12);color:#77efd3}.badge.green::before{background:var(--success)}.badge.purple{background:rgba(141,107,255,.13);color:#c1a8ff}.badge.purple::before{background:var(--primary)}.badge.orange{background:rgba(255,189,90,.12);color:#ffd08a}.badge.orange::before{background:var(--warning)}.badge.red{background:rgba(255,101,125,.13);color:#ff9baa}.badge.red::before{background:var(--danger)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions .btn{padding:5px 8px;font-size:11px}.filters{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:14px}.search{position:relative}.search input{padding-left:34px}.search::before{content:"⌕";position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:rgba(3,4,9,.72);backdrop-filter:blur(6px)}.modal-panel{width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:22px;background:#10141f;border:1px solid rgba(255,255,255,.08)}.modal-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;background:rgba(16,20,31,.97);border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.modal-head .close{width:34px;height:34px;border-radius:10px;background:var(--surface-3);color:#fff}.modal-body{padding:24px}.modal-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:9px;padding:16px 24px;background:rgba(16,20,31,.97);border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span2{grid-column:span 2}.fieldset{border:1px solid var(--line);border-radius:14px;padding:16px;margin:0}.fieldset legend{padding:0 8px;color:var(--primary-2);font-size:11px;font-weight:800;text-transform:uppercase}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{display:flex;align-items:center;margin:0;padding:7px 10px;border:1px solid var(--line);border-radius:9px;color:#c5cbe0;font-size:12px;text-transform:none}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.detail{background:#0d101a;border:1px solid var(--line);border-radius:11px;padding:12px}.detail .k{color:var(--muted-2);font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:4px}.detail .v{font-weight:650}.detail.full{grid-column:span 2}
.timeline{display:grid;gap:9px}.timeline-item,.installment{display:grid;gap:8px;align-items:center;background:#0d101a;border:1px solid var(--line);border-radius:10px;padding:8px}.timeline-item{grid-template-columns:1fr 1.5fr 150px 150px auto}.installment{grid-template-columns:130px 1fr 120px 170px auto}.history-item{background:#0d101a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px}.kanban-col{background:#0d101a;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:220px}.kanban-col h4{margin:0 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase}.deal-card{background:#161c2c;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px}.deal-card b{font-size:13px}.progress{height:6px;border-radius:99px;background:#20273a;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#c195ff)}.bar-chart{display:flex;align-items:flex-end;gap:12px;height:210px;padding-top:16px}.bar-wrap{flex:1;text-align:center}.bar{border-radius:7px;background:linear-gradient(to top,var(--primary),#c195ff);min-height:6px}.bar.green{background:linear-gradient(to top,#22b392,#6ff0cd)}.bar.red{background:linear-gradient(to top,#b2364e,#ff8b9d)}.bar-label{font-size:11px;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;z-index:30;padding:14px 17px;border-radius:13px;background:#181e2e;border:1px solid var(--line);font-weight:700;opacity:0;translate:0 14px;transition:.25s;pointer-events:none}.toast.show{opacity:1;translate:0 0}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.form-grid,.detail-grid{grid-template-columns:1fr}.span2,.detail.full{grid-column:auto}.timeline-item,.installment{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.sidebar{width:72px;padding:16px 8px}.sidebar .label-text,.side-foot,.side-section,.logo-text{display:none}.nav button{justify-content:center}main{margin-left:72px;width:calc(100% - 72px);padding:18px}.table{min-width:760px}}
</style></head><body>
<section id="login"><div class="auth-card"><div class="logo"><div class="logo-mark">C</div><span class="logo-text">CRITTUS FLOW</span></div><h1>Central de crescimento da sua agência.</h1><p>Clientes, oportunidades, projetos e financeiro conectados com foco em caixa e execução.</p><form onsubmit="event.preventDefault();login()"><div style="margin-bottom:14px"><label>Login</label><input id="loginUser" autocomplete="username" placeholder="admin"></div><div><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div><button class="btn full" style="margin-top:18px">Entrar na plataforma</button></form><div id="loginError" class="hidden" style="color:#ff97a7;font-size:13px;margin-top:12px">Login ou senha inválidos.</div></div></section>
<section id="app" class="hidden"><aside class="sidebar"><div class="logo" style="padding:0 8px 20px"><div class="logo-mark">C</div><span class="logo-text">CRITTUS FLOW</span></div><div class="side-section">Operação</div><nav class="nav"><button class="active" data-view="dashboard" onclick="setView('dashboard',this)" title="Dashboard"><span>◈</span><span class="label-text">Dashboard</span></button><button data-view="clients" onclick="setView('clients',this)" title="Clientes"><span>◎</span><span class="label-text">Clientes</span></button><button data-view="deals" onclick="setView('deals',this)" title="Negociações"><span>◇</span><span class="label-text">Negociações</span></button><button data-view="projects" onclick="setView('projects',this)" title="Projetos"><span>▣</span><span class="label-text">Projetos</span></button><button data-view="agenda" onclick="setView('agenda',this)" title="Agenda"><span>🗓</span><span class="label-text">Agenda</span></button></nav><div class="side-section">Financeiro</div><nav class="nav"><button data-view="payables" onclick="setView('payables',this)" title="Contas a pagar"><span>↓</span><span class="label-text">Contas a pagar</span></button><button data-view="receivables" onclick="setView('receivables',this)" title="Contas a receber"><span>↑</span><span class="label-text">Contas a receber</span></button></nav><div class="side-section">Dados</div><nav class="nav"><button onclick="exportBackup()" title="Exportar backup"><span>⇩</span><span class="label-text">Exportar backup</span></button><button onclick="$('#importInput').click()" title="Importar backup"><span>⇧</span><span class="label-text">Importar backup</span></button><button onclick="logout()" title="Sair"><span>⏻</span><span class="label-text">Sair</span></button></nav><input id="importInput" type="file" accept="application/json" class="hidden" onchange="importBackup(event)"><div class="side-foot"><b>Firebase Conectado.</b><br>Dados sincronizados na nuvem.</div></aside><main id="main"></main></section>
<div id="modal" class="modal hidden"><div class="modal-panel"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div><div id="toast" class="toast"></div>
<script>
// Configuração do Firebase[cite: 13]
const firebaseConfig = {
  apiKey: "AIzaSyCEUNMFEpSZS9_yETvZc2X3Yb9oIlUq4",
  authDomain: "crittus-flow.firebaseapp.com",
  databaseURL: "https://crittus-flow-default-rtdb.firebaseio.com",
  projectId: "crittus-flow",
  storageBucket: "crittus-flow.firebasestorage.app",
  messagingSenderId: "446646380066",
  appId: "1:446646380066:web:9934c96216f8c53559cc7b"
};

// Inicializar Firebase[cite: 13]
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

const KEY='crittus_flow_v8';
const STATUSES=['Não contatado','Paquera','Proposta','Fechado/Projeto','Perdido'];
const HEAT=['Frio','Morno','Quente'];
const ACTIONS=['Telefone','E-mail','WhatsApp','Visita','Outro'];
const NETWORKS=['Instagram','Facebook','Site/Blog','Google Meu Negócio','TikTok','Pinterest','YouTube','Outros'];

let db = migrate(loadLocal());
let currentView = 'dashboard';
let filters = {};
const $= s => document.querySelector(s),$$ = s => [...document.querySelectorAll(s)];

// Sincronização inicial com o Firebase
rtdb.ref('crittus_flow_data').once('value').then(snapshot => {
  if (snapshot.exists()) {
    db = migrate(snapshot.val());
    setView(currentView);
  }
}).catch(err => console.error("Erro ao carregar dados do Firebase:", err));

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{clients:[],deals:[],projects:[],payables:[],receivables:[]}}catch{return{clients:[],deals:[],projects:[],payables:[],receivables:[]}}}
function migrate(d){d=Object.assign({clients:[],deals:[],projects:[],payables:[],receivables:[]},d||{});d.clients.forEach(c=>{c.status=c.status||'Ativo';c.networks=c.networks||[]});d.deals.forEach(x=>{x.history=x.history||[];x.lossReason=x.lossReason||''});d.projects.forEach(p=>{p.schedule=(p.schedule||[]).map(a=>Object.assign({id:uid(),status:'Pendente'},a));p.receivableId=p.receivableId||null;delete p.installments});d.receivables.forEach(r=>{r.installments=(r.installments||[]).map(i=>Object.assign({id:uid(),payments:i.payments||[]},i))});d.payables.forEach(p=>{p.payments=p.payments||[];p.recurring=!!p.recurring});refreshOverdue(d);return d}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
    rtdb.ref('crittus_flow_data').set(db)
      .then(() => toast('Dados salvos na nuvem.'))
      .catch(e => {
        console.error("Erro ao salvar no Firebase:", e);
        toast('Erro ao sincronizar com o Firebase.','error');
      });
  }catch(e){
    toast('Erro de armazenamento local.','error')
  }
}

function refreshOverdue(d=db){const t=today();d.projects.forEach(p=>p.schedule.forEach(a=>{if(a.date&&a.date<t&&a.status!=='Concluído')a.status='Vencido'}))}
function localDate(date=new Date()){return new Date(date.getTime()-3*60*60*1000).toISOString().slice(0,10)}
function today(){return localDate()}function monthStart(){return today().slice(0,7)+'-01'}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dateBR(d){if(!d)return '—';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function toast(msg,type='ok'){const t=$('#toast');t.textContent=msg;t.style.borderColor=type==='error'?'#8d2338':'var(--line)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'—'}function client(id){return db.clients.find(c=>c.id===id)}function clientBlocked(id){return client(id)?.status==='Bloqueado'}function projectName(id){return db.projects.find(p=>p.id===id)?.name||'—'}
function badge(v){if(!v)return '<span class="badge">—</span>';const auto=/parcial/i.test(v)?'orange':/conclu|pago|recebido|fechado|ativo/i.test(v)?'green':/vencid|perdido|bloqueado/i.test(v)?'red':/execução|proposta|quente/i.test(v)?'purple':/pendente|não|em aberto/i.test(v)?'orange':'';return `<span class="badge ${auto}">${esc(v)}</span>`}
function login(){if($('#loginUser').value.trim()==='admin'&&$('#loginPass').value==='24121103'){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');setView('dashboard')}else $('#loginError').classList.remove('hidden')}
function logout(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')} function setView(v,btn){currentView=v;filters={};if(btn){$$('.nav button[data-view]').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}({dashboard:renderDashboard,clients:renderClients,deals:renderDeals,projects:renderProjects,agenda:renderAgenda,payables:renderPayables,receivables:renderReceivables})[v]();window.scrollTo(0,0)}
function page(title,sub,actions,body){$('#main').innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${actions||''}</div></div>${body}`}
function section(t,sub,c,right=''){return `<section class="section"><div class="section-title"><div><h2>${t}</h2>${sub?`<span class="small">${sub}</span>`:''}</div>${right}</div>${c}</section>`}
function tableCard(title,count,cols,rows,empty='Nenhum registro encontrado.',cta=''){return `<div class="card table-card"><div class="table-head"><div><h3>${title}</h3><span class="small">${count} registro(s)</span></div></div><div class="table-scroll"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="empty">${empty}${cta?`<div style="margin-top:14px">${cta}</div>`:''}</td></tr>`}</tbody></table></div></div>`}
function debounce(fn,ms=280){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
const searchDeals=debounce(v=>{filters.q=v;renderDeals()},280),searchClients=debounce(v=>{filters.q=v;renderClients()},280);
function clientOptions(sel=''){return `<option value="">Selecione um cliente</option>`+db.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}${c.status==='Bloqueado'?' — BLOQUEADO':''}</option>`).join('')}
function paidSum(x){return (x.payments||[]).reduce((s,p)=>s+Number(p.value||0),0)}
function instPaid(i){return (i.payments||[]).reduce((s,p)=>s+Number(p.value||0),0)}
function instRemaining(i){return Math.max(0,Number(i.value||0)-instPaid(i))}
function instStatus(i){const paid=instPaid(i);if(paid>=Number(i.value||0))return 'Recebido';if(paid>0)return 'Recebido parcial';if(i.due&&i.due<today())return 'Vencida';return 'Em aberto'}
function recTotal(r){return (r.installments||[]).reduce((s,i)=>s+Number(i.value||0),0)}function recPaid(r){return (r.installments||[]).reduce((s,i)=>s+instPaid(i),0)}
function renderDashboard(){const m=filters.month||today().slice(0,7);const recPrev=db.receivables.flatMap(r=>r.installments||[]).filter(i=>i.due.startsWith(m)).reduce((s,i)=>s+Number(i.value||0),0);const recReal=db.receivables.flatMap(r=>r.installments||[]).flatMap(i=>i.payments||[]).filter(p=>p.date.startsWith(m)).reduce((s,p)=>s+Number(p.value||0),0);const recOpen=db.receivables.reduce((s,r)=>s+recTotal(r)-recPaid(r),0);const payPrev=db.payables.filter(p=>p.due.startsWith(m)).reduce((s,p)=>s+Number(p.value||0),0);const payReal=db.payables.flatMap(p=>p.payments||[]).filter(p=>p.date.startsWith(m)).reduce((s,p)=>s+Number(p.value||0),0);const payOpen=db.payables.reduce((s,p)=>s+Number(p.value||0)-paidSum(p),0);const hot=db.deals.filter(d=>d.heat==='Quente'&&d.status!=='Fechado/Projeto'&&d.status!=='Perdido');const late=db.deals.filter(d=>d.nextDate&&d.nextDate<today()&&d.status!=='Fechado/Projeto'&&d.status!=='Perdido');const counts=STATUSES.map(s=>db.deals.filter(d=>d.status===s).length),max=Math.max(1,...counts);const bars=STATUSES.map((s,i)=>`<div class="bar-wrap"><div style="font-weight:900">${counts[i]}</div><div class="bar ${s==='Fechado/Projeto'?'green':s==='Perdido'?'red':''}" style="height:${Math.max(6,counts[i]/max*100)}%"></div><div class="bar-label">${esc(s)}</div></div>`).join('');page('Dashboard','Caixa, pipeline e execução com visão de previsto, realizado e saldo.','',`<div class="card"><div class="filters"><div><label>Mês de referência</label><input type="month" value="${m}" onchange="filters.month=this.value;renderDashboard()"></div></div><div class="grid metrics"><div class="card"><div class="metric-label">A receber — previsto</div><div class="metric-value primary">${brl(recPrev)}</div><div class="metric-sub">Vencimentos do mês</div></div><div class="card"><div class="metric-label">A receber — realizado</div><div class="metric-value good">${brl(recReal)}</div><div class="metric-sub">Recebimentos do mês</div></div><div class="card"><div class="metric-label">A receber — saldo aberto</div><div class="metric-value warn">${brl(recOpen)}</div><div class="metric-sub">Parcelas em aberto</div></div><div class="card"><div class="metric-label">Resultado realizado</div><div class="metric-value ${recReal-payReal>=0?'good':'bad'}">${brl(recReal-payReal)}</div><div class="metric-sub">Recebido menos pago no mês</div></div></div><div class="grid metrics" style="margin-top:14px"><div class="card"><div class="metric-label">A pagar — previsto</div><div class="metric-value warn">${brl(payPrev)}</div><div class="metric-sub">Vencimentos do mês</div></div><div class="card"><div class="metric-label">A pagar — realizado</div><div class="metric-value bad">${brl(payReal)}</div><div class="metric-sub">Pagamentos do mês</div></div><div class="card"><div class="metric-label">A pagar — saldo aberto</div><div class="metric-value">${brl(payOpen)}</div><div class="metric-sub">Compromissos em aberto</div></div><div class="card"><div class="metric-label">Follow-ups atrasados</div><div class="metric-value ${late.length?'bad':''}">${late.length}</div><div class="metric-sub">Oportunidades exigindo contato</div></div></div></div>${section('Pipeline comercial','Distribuição atual das oportunidades.',`<div class="card"><div class="bar-chart">${bars}</div></div>`)}${section('Prioridades comerciais','Oportunidades quentes e follow-ups atrasados.',tableCard('Prioridades',hot.length+late.length,['Cliente','Oportunidade','Valor','Engajamento','Próxima ação','Data',''],[...hot,...late].filter((v,i,a)=>a.indexOf(v)===i).map(d=>`<tr><td class="primary-cell">${esc(clientName(d.clientId))}</td><td>${esc((d.description\vert{}\vert{}'').slice(0,55))}</td><td>${brl(d.value)}</td><td>${badge(d.heat)}</td><td>${esc(d.nextAction||'—')}</td><td class="${d.nextDate&&d.nextDate<today()?'bad':''}">${dateBR(d.nextDate)}</td></tr>`).join(''),'Nenhuma prioridade comercial.','<button class="btn small" onclick="setView(\'deals\')">Ver negociações</button>'))}`)}
function renderClients(){const q=(filters.q||'').toLowerCase(),type=filters.type||'';const list=db.clients.filter(c=>(!q||[c.name,c.doc,c.city,c.email,c.phone,c.instagram].join(' ').toLowerCase().includes(q))&&(!type||c.type===type));const rows=list.map(c=>`<tr><td class="primary-cell">${esc(c.name)}${c.trade?`<div class="secondary-cell">${esc(c.trade)}</div>`:''}</td><td>${c.type==='PF'?'PF':'PJ'}</td><td>${badge(c.status||'Ativo')}</td><td>${esc(c.city||'—')}</td><td>${esc(c.phone||'—')}</td><td>${c.instagram?`<a target="_blank" href="https://instagram.com/${String(c.instagram).replace('@','')}">${esc(c.instagram)}</a>`:'—'}</td><td><div class="row-actions"><button class="btn small" onclick="openClient('${c.id}')">Abrir</button><button class="btn small ghost" onclick="clientMenu('${c.id}')">⋯</button></div></td></tr>`).join('');page('Clientes','Base de relacionamentos, canais e vínculos comerciais.','<button class="btn" onclick="openClientForm()">+ Novo cliente</button>',`<div class="card"><div class="filters"><div class="search"><label>Buscar</label><input value="${esc(filters.q||'')}" placeholder="Nome, documento, cidade..." oninput="searchClients(this.value)"></div><div><label>Tipo</label><select onchange="filters.type=this.value;renderClients()"><option value="">Todos</option><option value="PF">Pessoa Física</option><option value="PJ">Pessoa Jurídica</option></select></div></div></div>${section('Clientes cadastrados','Use o menu ⋯ para ações rápidas.',tableCard('Clientes',list.length,['Cliente','Tipo','Status','Cidade','Telefone','Instagram',''],rows,'Nenhum cliente cadastrado ainda.','<button class="btn small" onclick="openClientForm()">Cadastrar primeiro cliente</button>'))}`)}

function openClientForm(id){const c=id?client(id):{type:'PF',status:'Ativo',networks:[]};openModal(id?'Editar cliente':'Novo cliente',`<form id="clientForm"><div class="form-grid"><fieldset class="span2"><legend>Identificação</legend><div class="form-grid"><div><label>Tipo</label><select name="type" onchange="clientTypeFields(this.value)"><option value="PF">Pessoa Física</option><option value="PJ">Pessoa Jurídica</option></select></div><div><label>Status</label><select name="status"><option value="Ativo">Ativo</option><option value="Bloqueado">Bloqueado</option></select></div><div id="clientTypeFields"></div></div></fieldset><fieldset class="span2"><legend>Contato</legend><div class="form-grid"><div><label>Cidade / UF</label><input name="city" value="${esc(c.city||'')}"></div><div><label>E-mail</label><input name="email" type="email" value="${esc(c.email||'')}"></div><div><label>Telefone / WhatsApp</label><input name="phone" value="${esc(c.phone||'')}"></div><div><label>Instagram</label><input name="instagram" value="${esc(c.instagram||'')}"></div></div></fieldset><fieldset class="span2"><legend>Redes trabalhadas</legend><div class="checks">${NETWORKS.map(n=>`<label><input type="checkbox" name="networks" value="${n}" ${(c.networks\vert{}\vert{}[]).includes(n)?'checked':''}>${n}</label>`).join('')}</div></fieldset></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveClient('${id||''}')">Salvar</button>`);$('#clientForm [name=type]').value=c.type\vert{}\vert{}'PF';$('#clientForm [name=status]').value=c.status||'Ativo';clientTypeFields(c.type||'PF',c)}

function saveClient(id){const f=$('#clientForm');if(!f.reportValidity())return;const d=formData(f);d.networks=$$('[name=networks]:checked').map(x=>x.value);if(id)Object.assign(client(id),d);else{d.id=uid();d.createdAt=today();db.clients.push(d)}save();closeModal();renderClients();toast('Cliente salvo.')}

function renderDeals(){const q=(filters.q||'').toLowerCase();const list=db.deals.filter(d=>!q||[clientName(d.clientId),d.description,d.notes].join(' ').toLowerCase().includes(q));const kanban=STATUSES.map(s=>`<div class="kanban-col"><h4>${esc(s)}</h4>${list.filter(d=>d.status===s).map(d=>`<div class="deal-card"><b>${esc(clientName(d.clientId))}</b><div class="secondary-cell">${esc((d.description||'').slice(0,60))}</div><div class="secondary-cell">${brl(d.value)} ·${badge(d.heat)}</div><div class="row-actions" style="margin-top:8px"><button class="btn small ghost" onclick="moveDeal('${d.id}',-1)">←</button><button class="btn small" onclick="openDeal('${d.id}')">Abrir</button><button class="btn small ghost" onclick="moveDeal('${d.id}',1)">→</button></div></div>`).join('')||'<div class="secondary-cell">Sem oportunidades.</div>'}</div>`).join('');const rows=list.map(d=>`<tr><td class="primary-cell">${esc(clientName(d.clientId))}<div class="secondary-cell">${esc((d.description||'').slice(0,55))}</div></td><td>${brl(d.value)}</td><td>${badge(d.status)}</td><td>${badge(d.heat)}</td><td class="${d.nextDate&&d.nextDate<today()?'bad':''}">${dateBR(d.nextDate)}</td><td><div class="row-actions"><button class="btn small" onclick="openDeal('${d.id}')">Abrir</button><button class="btn small ghost" onclick="dealMenu('${d.id}')">⋯</button></div></td></tr>`).join('');page('Negociações','Pipeline visual, histórico comercial e conversão em projetos.','<button class="btn" onclick="openDealForm()">+ Nova oportunidade</button>',`${section('Kanban comercial','Use as setas para avançar ou retroceder.',`<div class="kanban">${kanban}</div>`)}${section('Lista de negociações','',tableCard('Oportunidades',list.length,['Cliente','Valor','Status','Engajamento','Próxima ação',''],rows))}`)}
function dealMenu(id){openModal('Ações da negociação','',`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn ghost" onclick="closeModal();openDealForm('${id}')">Editar</button><button class="btn ghost" onclick="closeModal();dealToProject('${id}')">Virar Projeto</button><button class="btn danger" onclick="deleteDeal('${id}')">Excluir</button>`)}
function moveDeal(id,dir){const d=db.deals.find(x=>x.id===id);if(d.status==='Perdido'||d.status==='Fechado/Projeto')return toast('Negociação congelada.','error');const i=STATUSES.indexOf(d.status)+dir;if(i<0||i>=STATUSES.length)return;d.status=STATUSES[i];if(d.status==='Perdido'&&!d.lossReason){const reason=prompt('Motivo da perda (obrigatório):');if(!reason){d.status='Proposta';return}d.lossReason=reason;d.history.push({date:today(),type:'Perda',note:reason})}if(d.status==='Fechado/Projeto'){const p=createProjectFromDeal(d);save();closeModal();projectCreatedPopup(p);return}d.history.push({date:today(),type:'Status',note:d.status});save();renderDeals()}

span2 hidden" id="lossField"><label>Motivo da perda *</label><input name="lossReason" value="${esc(d.lossReason||'')}"></div></div></fieldset></div></form>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveDeal('${id||''}')">Gravar</button>`);dealStatusFields(d.status)}

function saveDeal(id){const f=$('#dealForm');if(!f.reportValidity())return;const d=formData(f);if(!d.clientId)return toast('Selecione um cliente.','error');if(!id&&clientBlocked(d.clientId))return alert('Impossível criar novas negociações pois o cliente está bloqueado.');d.value=Number(d.value||0);if(d.status==='Perdido'&&!d.lossReason)return toast('Informe o motivo da perda.','error');if(id){const old=db.deals.find(x=>x.id===id);if(old.status==='Perdido'||old.status==='Fechado/Projeto')return toast('Negociação congelada.','error');const changed=old.status!==d.status;Object.assign(old,d);if(changed)old.history.push({date:today(),type:'Status',note:d.status});if(d.status==='Fechado/Projeto'&&changed){const p=createProjectFromDeal(old);save();closeModal();projectCreatedPopup(p);return}}else{d.id=uid();d.createdAt=today();d.history=[{date:today(),type:'Criação',note:'Oportunidade cadastrada'}];db.deals.push(d);if(d.status==='Fechado/Projeto'){const p=createProjectFromDeal(d);save();closeModal();projectCreatedPopup(p);return}}save();closeModal();renderDeals()}

function projectMenu(id){openModal('Ações do projeto','',`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn ghost" onclick="closeModal();openProjectForm('${id}')">Editar</button><button class="btn ghost" onclick="closeModal();openProjectFinance('${id}')">Financeiro</button><button class="btn danger" onclick="deleteProject('${id}')">Excluir</button>`)}
function projectReceivable(id){return db.receivables.find(r=>r.projectId===id)}
function openProjectForm(id,preset={}){if(typeof preset==='string')preset={clientId:preset};let p;if(id){p=db.projects.find(x=>x.id===id)}else{if(clientBlocked(preset.clientId))return alert('Impossível criar novos projetos pois o cliente está bloqueado.');p=Object.assign({status:'Pendente',schedule:[]},preset)}const rec=id?projectReceivable(id):null;openModal(id?'Editar projeto':'Novo projeto',`<form id="projectForm"><div class="form-grid"><div><label>Cliente *</label><select name="clientId" required>${clientOptions(p.clientId)}</select></div><div><label>Negociação</label><select name="dealId"><option value="">Sem vínculo</option>${db.deals.map(d=>`<option value="${d.id}" ${d.id===p.dealId?'selected':''}>${esc(clientName(d.clientId))}</option>`).join('')}</select></div><div class="span2"><label>Nome do projeto *</label><input name="name" required value="${esc(p.name||'')}"></div><div><label>Valor</label><input name="value" type="number" step="0.01" value="${p.value||''}"></div><div><label>Status</label><select name="status"><option>Pendente</option><option>Em execução</option><option>Concluído</option></select></div></div></form><div class="section-title" style="margin-top:20px"><h2>Cronograma</h2><button class="btn small" onclick="addProjectScheduleLine()">+ Ação</button></div><div id="projectSchedule" class="timeline">${(p.schedule||[]).map(scheduleLine).join('')}</div><div class="section-title" style="margin-top:20px"><h2>Recebimentos</h2><span class="small">${rec?'Parcelas e recebimentos ficam na conta a receber vinculada.':'Ao salvar, será criada uma conta a receber vinculada.'}</span>${rec?'':`<button class="btn small" onclick="addProjectInstallment()">+ Parcela</button>`}</div><div id="projectInstallments" class="timeline">${rec?(rec.installments||[]).map((i,idx)=>installmentLine(i,true,rec.id,idx)).join(''):[{due:today(),value:'',payments:[]}].map(i=>installmentLine(i,false,'',-1)).join('')}</div>`,`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveProjectForm('${id||''}')">Salvar projeto</button>`)}
function addProjectScheduleLine(){$('#projectSchedule').insertAdjacentHTML('beforeend',scheduleLine())}
function addProjectInstallment(){$('#projectInstallments').insertAdjacentHTML('beforeend',installmentLine())}
function saveProjectForm(id){const f=$('#projectForm');if(!f.reportValidity())return;const d=formData(f);d.value=Number(d.value||0);d.schedule=$$('#projectSchedule .timeline-item').map(r=>{const e=r.querySelectorAll('input,select');return{id:r.dataset.id\vert{}\vert{}uid(),action:e[0].value,info:e[1].value,status:e[2].value,date:e[3].value}}).filter(x=>x.action\vert{}\vert{}x.info\vert{}\vert{}x.date);let p;if(id){p=db.projects.find(x=>x.id===id);Object.assign(p,d)}else{if(clientBlocked(d.clientId))return alert('Impossível criar novos projetos pois o cliente está bloqueado.');p=Object.assign({id:uid(),createdAt:today()},d);db.projects.push(p)}const rec=projectReceivable(p.id);if(!id\vert{}\vert{}!rec){const insts=$$('#projectInstallments .installment').map(r=>{const e=r.querySelectorAll('input');return{id:uid(),label:e[0].value,due:e[1].value,value:Number(e[2].value||0),payments:[]}}).filter(i=>i.due&&i.value>0);if(insts.length){const r={id:rec?rec.id:uid(),clientId:p.clientId,projectId:p.id,description:p.name,value:insts.reduce((s,i)=>s+i.value,0),installments:insts,status:'Pendente',createdAt:today()};if(rec)Object.assign(rec,r);else{db.receivables.push(r);p.receivableId=r.id}}}else if(rec){rec.description=p.name;rec.value=p.value}refreshOverdue();save();closeModal();renderProjects();toast('Projeto salvo.')}
function openProjectFinance(id){const p=db.projects.find(x=>x.id===id);const rec=projectReceivable(id);openModal('Financeiro — '+p.name,rec?`<div class="detail-grid"><div class="detail"><div class="k">Total</div><div class="v">${brl(recTotal(rec))}</div></div><div class="detail"><div class="k">Recebido</div><div class="v good">${brl(recPaid(rec))}</div></div></div><div class="section-title" style="margin-top:18px"><h2>Parcelas</h2></div>${(rec.installments||[]).map((i,idx)=>installmentLine(i,true,rec.id,idx)).join('')}`:'<div class="empty">Nenhum recebível vinculado.</div>',`<button class="btn secondary" onclick="closeModal()">Fechar</button>${rec?`<button class="btn" onclick="closeModal();openReceivableForm('${rec.id}')">Abrir conta a receber</button>`:''}`)}
function openProject(id){const p=db.projects.find(x=>x.id===id);const total=(p.schedule||[]).length,done=(p.schedule||[]).filter(a=>a.status==='Concluído').length;openModal(p.name,`<div class="detail-grid"><div class="detail"><div class="k">Cliente</div><div class="v">${esc(clientName(p.clientId))}</div></div><div class="detail"><div class="k">Valor</div><div class="v">${brl(p.value)}</div></div><div class="detail"><div class="k">Escopo / entregáveis</div><div class="v">${esc(p.scope||'Não informado')}</div></div><div class="detail"><div class="k">Progresso</div><div class="v">${done}/${total} ações</div></div></div><div class="section-title" style="margin-top:18px"><h2>Cronograma</h2><button class="btn small" onclick="addScheduleLine()">+ Ação</button></div><div id="scheduleList" class="timeline">${(p.schedule||[]).map(scheduleLine).join('')}</div>`,`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn success" onclick="saveSchedule('${id}')">Salvar cronograma</button>`)}
function scheduleLine(a={}){return `<div class="timeline-item" data-id="${a.id||uid()}"><input placeholder="Ação" value="${esc(a.action||'')}"><input placeholder="Entregável / informações" value="${esc(a.info||'')}"><select>${['Pendente','Em execução','Vencido','Concluído'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select><input type="date" value="${a.date||''}"><button class="icon" onclick="this.closest('.timeline-item').remove()">×</button></div>`}
function addScheduleLine(){$('#scheduleList').insertAdjacentHTML('beforeend',scheduleLine())} function saveSchedule(id){const p=db.projects.find(x=>x.id===id);p.schedule=$$('#scheduleList .timeline-item').map(r=>{const e=r.querySelectorAll('input,select');return{id:r.dataset.id,action:e[0].value,info:e[1].value,status:e[2].value,date:e[3].value}}).filter(x=>x.action||x.info||x.date);refreshOverdue();p.status=p.schedule.length&&p.schedule.every(x=>x.status==='Concluído')?'Concluído':p.schedule.some(x=>x.status==='Em execução')?'Em execução':'Pendente';save();closeModal();renderProjects()}
function deleteProject(id){const rec=projectReceivable(id);if(rec&&recPaid(rec)>0)return toast('Projeto possui recebimentos registrados.','error');if(rec&&!confirm('Excluir projeto e sua conta a receber vinculada?'))return;if(rec)db.receivables=db.receivables.filter(r=>r.id!==rec.id);db.projects=db.projects.filter(p=>p.id!==id);save();renderProjects()}
function renderPayables(){const q=(filters.q||'').toLowerCase(),status=filters.status||'',m=filters.month||'';const list=db.payables.filter(p=>(!q||[p.supplier,p.description].join(' ').toLowerCase().includes(q))&&(!status||p.status===status)&&(!m||p.due.startsWith(m)));const rows=list.map(p=>{const paid=paidSum(p),rem=Math.max(0,p.value-paid);return `<tr><td class="primary-cell">${esc(p.supplier)}<div class="secondary-cell">${esc(p.description)}</div></td><td>${brl(p.value)}</td><td>${dateBR(p.due)}</td><td>${brl(paid)}<div class="secondary-cell">Saldo ${brl(rem)}</div></td><td>${badge(p.status)}</td><td>${p.recurring?'<span class="badge purple">Recorrente</span>':'—'}</td><td><div class="row-actions"><button class="btn small" onclick="openPayableDetails('${p.id}')">Pagamentos</button><button class="btn small ghost" onclick="payableMenu('${p.id}')">⋯</button></div></td></tr>`}).join('');page('Contas a pagar','Pagamentos parciais, recorrentes e controle de saldo.','<button class="btn" onclick="openPayableForm()">+ Nova conta</button>',`<div class="grid metrics"><div class="card"><div class="metric-label">Previsto no mês</div><div class="metric-value warn">${brl(list.filter(p=>p.due.startsWith(filters.month||today().slice(0,7))).reduce((s,p)=>s+p.value,0))}</div></div><div class="card"><div class="metric-label">Pago no mês</div><div class="metric-value bad">${brl(db.payables.flatMap(p=>p.payments).filter(x=>x.date.startsWith(filters.month||today().slice(0,7))).reduce((s,p)=>s+p.value,0))}</div></div><div class="card"><div class="metric-label">Saldo aberto</div><div class="metric-value">${brl(list.reduce((s,p)=>s+p.value-paidSum(p),0))}</div></div><div class="card"><div class="metric-label">Recorrentes</div><div class="metric-value">${list.filter(p=>p.recurring).length}</div></div></div>${section('Contas',tableCard('Contas a pagar',list.length,['Fornecedor','Valor','Vencimento','Pago / saldo','Status','Recorrência',''],rows))}`)}
function payableMenu(id){openModal('Ações da conta','',`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn ghost" onclick="closeModal();openPayableForm('${id}',true)">Editar</button><button class="btn danger" onclick="deleteFinance('payables','${id}')">Excluir</button>`)}
function openPayableForm(id,edit){const p=id?db.payables.find(x=>x.id===id):{due:today(),payments:[],recurring:false};openModal(id&&!edit?'Pagamentos — '+p.supplier:id?'Editar conta':'Nova conta a pagar',`<form id="financeForm"><div class="form-grid"><div><label>Fornecedor *</label><input name="supplier" required value="${esc(p.supplier||'')}"></div><div><label>Conta</label><input name="account" value="${esc(p.account||'')}"></div><div class="span2"><label>Descrição *</label><input name="description" required value="${esc(p.description||'')}"></div><div><label>Valor *</label><input name="value" type="number" step="0.01" required value="${p.value||''}"></div><div><label>Vencimento *</label><input name="due" type="date" required value="${p.due||today()}"></div><div class="span2"><label>Código de barras / PIX</label><input name="code" value="${esc(p.code||'')}"></div><div><label>Repetir mensalmente</label><select name="recurring"><option value="">Não</option><option value="1" ${p.recurring?'selected':''}>Sim — criar cópias por 6 meses</option></select></div></div></form>`,id&&!edit?`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn success" onclick="openPaymentForm('${id}')">+ Novo pagamento</button>`:`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePayable('${id||''}')">Salvar</button>`)}
function savePayable(id){const f=$('#financeForm');if(!f.reportValidity())return;const d=formData(f);d.value=Number(d.value||0);d.recurring=d.recurring==='1';d.payments=id?db.payables.find(x=>x.id===id).payments:[];d.status=paidSum(d)>=d.value&&d.value>0?'Pago':paidSum(d)>0?'Parcial':'Pendente';if(id){Object.assign(db.payables.find(x=>x.id===id),d)}else{d.id=uid();db.payables.push(d);if(d.recurring)for(let i=1;i<=6;i++){const dt=new Date(d.due+'T12:00:00');dt.setMonth(dt.getMonth()+i);db.payables.push({...d,id:uid(),due:localDate(dt),payments:[],recurring:false,status:'Pendente'})}}save();closeModal();renderPayables()}
function openPayableDetails(id){const p=db.payables.find(x=>x.id===id);const paid=paidSum(p),rem=Math.max(0,p.value-paid);openModal('Pagamentos — '+p.supplier,`<div class="detail-grid"><div class="detail"><div class="k">Valor original</div><div class="v">${brl(p.value)}</div></div><div class="detail"><div class="k">Saldo pendente</div><div class="v">${brl(rem)}</div></div></div><div class="section-title" style="margin-top:16px"><h2>Pagamentos</h2>${p.status!=='Pago'?`<button class="btn small" onclick="openPaymentForm('${id}')">+ Pagamento</button>`:''}</div>${p.payments.map((x,i)=>`<div class="timeline-item"><div><b>${dateBR(x.date)}</b></div><div>${esc(x.method\vert{}\vert{}'—')} ·${esc(x.bank||'—')}</div><div>${brl(x.value)}</div><div>${badge(p.status)}</div><button class="icon" onclick="deletePayment('${id}',${i})">×</button></div>`).join('')||'<div class="empty">Nenhum pagamento.</div>'}`,'<button class="btn secondary" onclick="closeModal()">Fechar</button>')}
function openPaymentForm(id){const p=db.payables.find(x=>x.id===id);const rem=Math.max(0,p.value-paidSum(p));openModal('Registrar pagamento',`<form id="paymentForm"><div class="form-grid"><div><label>Data *</label><input name="date" type="date" required value="${today()}"></div><div><label>Valor *</label><input name="value" type="number" step="0.01" max="${rem}" required value="${rem}"></div><div><label>Forma</label><select name="method"><option>Pix</option><option>Transferência</option><option>Boleto</option><option>Cartão</option><option>Dinheiro</option></select></div><div><label>Banco</label><input name="bank"></div></div></form>`,`<button class="btn secondary" onclick="openPayableDetails('${id}')">Cancelar</button><button class="btn success" onclick="savePayment('${id}')">Gravar</button>`)}
function savePayment(id){const p=db.payables.find(x=>x.id===id);const d=formData($('#paymentForm'));const v=Number(d.value||0),rem=Math.max(0,p.value-paidSum(p));if(v<=0||v>rem)return toast('Valor inválido ou superior ao saldo.','error');p.payments.push({id:uid(),date:d.date,value:v,method:d.method,bank:d.bank});p.status=paidSum(p)>=p.value?'Pago':'Parcial';save();openPayableDetails(id)}
function deletePayment(id,i){const p=db.payables.find(x=>x.id===id);p.payments.splice(i,1);p.status=paidSum(p)>=p.value?'Pago':paidSum(p)>0?'Parcial':'Pendente';save();openPayableDetails(id)}
function renderReceivables(){const q=(filters.q||'').toLowerCase(),status=filters.status||'',m=filters.month||'';const list=db.receivables.filter(r=>(!q||[clientName(r.clientId),projectName(r.projectId),r.description].join(' ').toLowerCase().includes(q))&&(!status||r.status===status)&&(!m||(r.installments||[]).some(i=>i.due.startsWith(m))));const rows=list.map(r=>{const total=recTotal(r),paid=recPaid(r);return `<tr><td class="primary-cell">${esc(clientName(r.clientId))}<div class="secondary-cell">${esc(projectName(r.projectId))}</div></td><td>${esc(r.description)}</td><td>${brl(total)}</td><td>${brl(paid)}<div class="secondary-cell">Saldo ${brl(total-paid)}</div></td><td>${badge(r.status)}</td><td><div class="row-actions"><button class="btn small" onclick="openReceivableForm('${r.id}')">Abrir</button><button class="btn small ghost" onclick="receivableMenu('${r.id}')">⋯</button></div></td></tr>`}).join('');page('Contas a receber','Fonte única das parcelas, recebimentos parciais e vínculo com projetos.','<button class="btn" onclick="openReceivableForm()">+ Nova conta</button>',`${section('Contas',tableCard('Contas a receber',list.length,['Cliente / projeto','Descrição','Total','Recebido / saldo','Status',''],rows))}`)}
function receivableMenu(id){openModal('Ações','',`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn ghost" onclick="closeModal();openReceivableForm('${id}',true)">Editar</button><button class="btn danger" onclick="deleteFinance('receivables','${id}')">Excluir</button>`)}
function openReceivableForm(id,edit,preset={}){const r=id?db.receivables.find(x=>x.id===id):Object.assign({installments:[{id:uid(),due:today(),value:'',payments:[]}]},preset);openModal(id&&!edit?'Conta a receber — '+clientName(r.clientId):id?'Editar conta':'Nova conta a receber',`<form id="financeForm"><div class="form-grid"><div><label>Cliente</label><select name="clientId">${clientOptions(r.clientId)}</select></div><div><label>Projeto</label><select name="projectId"><option value="">Sem vínculo</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===r.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="span2"><label>Descrição *</label><input name="description" required value="${esc(r.description||'')}"></div></div><div class="section-title" style="margin-top:18px"><h2>Parcelas</h2><button type="button" class="btn small" onclick="addInstallment()">+ Parcela</button></div><div id="installments" class="timeline">${(r.installments||[]).map((i,idx)=>installmentLine(i,!!id,r.id,idx)).join('')}</div></form>`,id&&!edit?`<button class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn" onclick="saveReceivable('${id}')">Salvar</button>`:`<button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveReceivable('${id||''}')">Salvar</button>`)}
function installmentLine(i={},canReceive=false,rid='',idx=0){const paid=instPaid(i),rem=instRemaining(i);return `<div class="installment" data-id="${i.id||uid()}"><input placeholder="Identificação" value="${esc(i.label||'')}"><input type="date" value="${i.due||today()}"><input type="number" step="0.01" placeholder="Valor" value="${i.value||''}"><div><input disabled value="${i.status||'Em aberto'}"><div class="secondary-cell">${brl(paid)} pago · saldo ${brl(rem)}</div>${canReceive?`<button class="btn small success" style="margin-top:6px;width:100%" onclick="receiveInstallment('${rid}','${i.id}')">Receber</button>`:''}</div><button class="icon" onclick="this.closest('.installment').remove()">×</button></div>`}
function addInstallment(){$('#installments').insertAdjacentHTML('beforeend',installmentLine())}
function receiveInstallment(rid,iid){const r=db.receivables.find(x=>x.id===rid);const i=r.installments.find(x=>x.id===iid);const rem=instRemaining(i);openModal('Receber parcela',`<form id="receiptForm"><div class="form-grid"><div><label>Data *</label><input name="date" type="date" required value="${today()}"></div><div><label>Valor *</label><input name="value" type="number" step="0.01" max="${rem}" required value="${rem}"></div></div><p class="small" style="margin-top:12px">Saldo pendente: <b>${brl(rem)}</b>.</p></form>`,`<button class="btn secondary" onclick="closeModal();openProjectForm('${r.projectId}')">Cancelar</button><button class="btn success" onclick="saveReceipt('${rid}','${iid}')">Gravar</button>`)}
function saveReceipt(rid,iid){const r=db.receivables.find(x=>x.id===rid);const i=r.installments.find(x=>x.id===iid);const d=formData($('#receiptForm'));const v=Number(d.value||0);if(v<=0||v>instRemaining(i))return toast('Valor inválido ou superior ao saldo.','error');i.payments.push({id:uid(),date:d.date,value:v});i.status=instStatus(i);r.status=r.installments.every(x=>x.status==='Recebido')?'Recebido':'Pendente';save();closeModal();r.projectId?openProjectForm(r.projectId):openReceivableForm(rid)}
function saveReceivable(id){const f=$('#financeForm');if(!f.reportValidity())return;const d=formData(f);const old=id?db.receivables.find(x=>x.id===id):null;d.installments=$$('#installments .installment').map(row=>{const e=row.querySelectorAll('input');const oldInst=old?.installments?.find(i=>i.id===row.dataset.id);return{id:row.dataset.id,label:e[0].value,due:e[1].value,value:Number(e[2].value||0),payments:oldInst?.payments||[]}}).filter(i=>i.due&&i.value>0);d.installments.forEach(i=>i.status=instStatus(i));d.value=d.installments.reduce((s,i)=>s+i.value,0);d.status=d.installments.every(i=>i.status==='Recebido')?'Recebido':'Pendente';if(id){Object.assign(old,d);const p=db.projects.find(x=>x.id===old.projectId);if(p)p.receivableId=old.id}else{d.id=uid();db.receivables.push(d);const p=db.projects.find(x=>x.id===d.projectId);if(p)p.receivableId=d.id}save();closeModal();renderReceivables()}
function deleteFinance(type,id){if(confirm('Excluir lançamento?')){db[type]=db[type].filter(x=>x.id!==id);save();type==='payables'?renderPayables():renderReceivables()}}
function renderAgenda(){const start=filters.start||monthStart(),end=filters.end||today();const items=[];db.projects.forEach(p=>(p.schedule||[]).forEach(a=>{if(a.date>=start&&a.date<=end)items.push({date:a.date,client:clientName(p.clientId),clientId:p.clientId,project:p.name,action:a.action,info:a.info,status:a.status,notes:(db.deals.find(d=>d.clientId===p.clientId)||{}).notes||''})}));db.deals.forEach(d=>{if(d.nextDate>=start&&d.nextDate<=end)items.push({date:d.nextDate,client:clientName(d.clientId),clientId:d.clientId,project:d.description,action:'Follow-up '+d.nextAction,info:d.notes,status:d.status,notes:d.notes})});items.sort((a,b)=>a.date.localeCompare(b.date));const rows=items.map(x=>{const c=client(x.clientId)||{};const wa=(c.phone||'').replace(/\D/g,'');return `<tr><td class="primary-cell">${esc(x.client)}<div class="secondary-cell">${esc(x.project)}</div></td><td>${dateBR(x.date)}</td><td>${esc(x.action)}</td><td>${esc(x.info)}</td><td>${esc(x.notes||'—')}</td><td><div class="row-actions">${wa?`<a class="btn small ghost" target="_blank" href="https://wa.me/55${wa}">WhatsApp</a>`:''}${c.email?`<a class="btn small ghost" href="mailto:${esc(c.email)}">E-mail</a>`:''}</div></td></tr>`}).join('');page('Agenda','Selecione o período e gere o relatório de interações.','<button class="btn" onclick="generateAgendaPDF()">⇩ Gerar PDF</button>',`<div class="card"><div class="filters"><div><label>Início</label><input type="date" value="${start}" onchange="filters.start=this.value;renderAgenda()"></div><div><label>Fim</label><input type="date" value="${end}" onchange="filters.end=this.value;renderAgenda()"></div></div></div>${section('Compromissos',tableCard('Agenda operacional',items.length,['Cliente / projeto','Data','Ação','Informações','Orientação','Contato'],rows,'Nenhum compromisso no período.'))}`)}
function generateAgendaPDF(){const start=filters.start||monthStart(),end=filters.end||today();const items=renderAgendaItems();if(!items.length)return toast('Nenhum compromisso no período.','error');const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});let y=60;doc.setFontSize(18);doc.text('Crittus Flow — Agenda',40,y);doc.setFontSize(10);doc.text(`Período: ${dateBR(start)} a ${dateBR(end)}`,40,y+=20);y+=26;items.forEach((x,i)=>{if(y>740){doc.addPage();y=50}doc.setFontSize(12);doc.text(`${i+1}. ${x.client}`,40,y);y+=15;doc.setFontSize(10);doc.text(`Data: ${dateBR(x.date)} | Ação: ${x.action} | Status: ${x.status}`,48,y);y+=13;doc.text(doc.splitTextToSize(`Projeto: ${x.project}`,500),48,y);y+=24;doc.text(doc.splitTextToSize(`Orientação: ${x.notes||'Não informada'}`,500),48,y);y+=28});doc.save(`agenda-${start}_a_${end}.pdf`)}
function renderAgendaItems(){const start=filters.start||monthStart(),end=filters.end||today();const items=[];db.projects.forEach(p=>(p.schedule||[]).forEach(a=>{if(a.date>=start&&a.date<=end)items.push({date:a.date,client:clientName(p.clientId),project:p.name,action:a.action,status:a.status,notes:(db.deals.find(d=>d.clientId===p.clientId)||{}).notes||''})}));db.deals.forEach(d=>{if(d.nextDate>=start&&d.nextDate<=end)items.push({date:d.nextDate,client:clientName(p.clientId),project:d.description,action:'Follow-up '+d.nextAction,status:d.status,notes:d.notes})});return items.sort((a,b)=>a.date.localeCompare(b.date))}
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download=`crittus-backup-${today()}.json`;a.click()}
function importBackup(e){const file=e.target.files[0];if(!file)return;if(!confirm('Importar substituirá os dados atuais. Continuar?'))return;const r=new FileReader();r.onload=()=>{try{db=migrate(JSON.parse(r.result));save();setView(currentView);toast('Backup importado.')}catch{toast('Arquivo inválido.','error')}};r.readAsText(file)}
function openModal(t,b,f=''){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modalFoot').innerHTML=f;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function formData(f){return Object.fromEntries(new FormData(f))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
